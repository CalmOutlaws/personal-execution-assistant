{% extends "layout.html" %}

{% block title %}New Task - EXECUTE{% endblock %}

{% block content %}
    <h1>Create a task</h1>

    {% if errors %}
        <ul class="errors">
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST" action="{{ url_for('new_task') }}">
        <p>
            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ request.form.get('title', '') }}"
                required
            >
        </p>

        <p>
            <label for="description">Description (optional)</label>
            <textarea id="description" name="description">{{ request.form.get('description', '') }}</textarea>
        </p>

        <p>
            <label for="due_at">Due date and time (optional)</label>
            <input
                type="datetime-local"
                id="due_at"
                name="due_at"
                value="{{ request.form.get('due_at', '') }}"
            >
        </p>

        <p>
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
                {% for priority in priorities %}
                    <option
                        value="{{ priority }}"
                        {% if request.form.get('priority', 'medium') == priority %}selected{% endif %}
                    >{{ priority }}</option>
                {% endfor %}
            </select>
        </p>

        <button type="submit">Create Task</button>
    </form>

    <p>
        <a href="{{ url_for('tasks') }}">Back to tasks</a>
    </p>
{% endblock %}
